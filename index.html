const SHIFT_META={"Prva smena":{label:"Prva smena",time:"08:00–16:00",short:"I",cls:"prva"},"Međusmena":{label:"Međusmena",time:"11:00–18:00",short:"M",cls:"medju"},"Druga smena":{label:"Druga smena",time:"15:30–22:30",short:"II",cls:"druga"},"Slobodan dan":{label:"Slobodan dan",time:"—",short:"S",cls:"slobodan"},"Godišnji odmor":{label:"Godišnji odmor",time:"—",short:"GO",cls:"godisnji"}};

function parseDate(k){return new Date(k+"T12:00:00")}function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}function formatDate(k){const d=parseDate(k);return d.getDate()+". "+srMonths[d.getMonth()]+" "+d.getFullYear()+"."}
function selectedEmployee(){return document.getElementById("employeeSelect").value}function selectedItems(){return scheduleData[selectedEmployee()]||[]}function selectedMap(){return Object.fromEntries(selectedItems().map(x=>[x.date,x.shift]))}
function pill(s,b=false){const m=SHIFT_META[s]||{label:s,time:"",cls:""};return `<div class="pill ${m.cls} ${b?"big":""}"><span>${m.label}</span>${m.time?`<small>${m.time}</small>`:""}</div>`}
function effectiveToday(){const k=dateKey(new Date());return selectedMap()[k]?k:"2026-05-12"}
function renderTop(){const map=selectedMap(),today=effectiveToday(),tomorrow=dateKey(addDays(parseDate(today),1));const next=selectedItems().find(x=>x.date>today&&x.shift==="Slobodan dan");todayBox.innerHTML=`<div class="muted">${formatDate(today)}</div>`+pill(map[today]||"Nema unosa",true);tomorrowBox.innerHTML=`<div class="muted">${formatDate(tomorrow)}</div>`+pill(map[tomorrow]||"Nema unosa",true);nextFree.textContent=next?formatDate(next.date):"Nema";nextFreeDay.textContent=next?srDays[parseDate(next.date).getDay()]:""}
function renderTeamToday(){const today=effectiveToday();teamToday.innerHTML=employees.map(e=>{const item=(scheduleData[e]||[]).find(x=>x.date===today);return `<div class="teamItem"><div><b>${e}</b><div class="muted">${formatDate(today)}</div></div>${pill(item?item.shift:"Nema unosa")}</div>`}).join("")}
function renderCalendar(){const sel=monthSelect.value,[y,m]=sel.split("-").map(Number),first=new Date(y,m-1,1,12),start=addDays(first,first.getDay()===0?-6:1-first.getDay()),today=effectiveToday(),map=selectedMap();calendar.innerHTML="";for(let i=0;i<42;i++){const d=addDays(start,i),key=dateKey(d),shift=map[key],meta=SHIFT_META[shift],el=document.createElement("div");el.className="day"+(meta?" "+meta.cls:"")+(monthKey(d)!==sel?" outside":"")+(key===today?" today":"");el.innerHTML=`<div class="dayNum">${d.getDate()}</div>`+(meta?`<div class="short">${meta.short}</div><div class="shiftName">${shift}</div>`:"");calendar.appendChild(el)}}
function renderList(){const q=searchInput.value.toLowerCase().trim();const filtered=selectedItems().filter(x=>`${formatDate(x.date)} ${srDays[parseDate(x.date).getDay()]} ${x.shift}`.toLowerCase().includes(q));resultList.innerHTML=filtered.map(x=>`<div class="item"><div><b>${formatDate(x.date)}</b><div class="muted">${srDays[parseDate(x.date).getDay()]}</div></div>${pill(x.shift)}</div>`).join("")}

function renderAll(){renderTop();renderTeamToday();renderCalendar();renderList();renderStats()}
function exportText(){const lines=["RASPORED SMENA - "+selectedEmployee(),""].concat(selectedItems().map(x=>`${formatDate(x.date)} (${srDays[parseDate(x.date).getDay()]}): ${x.shift} ${SHIFT_META[x.shift]?.time||""}`));const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="raspored-"+selectedEmployee().toLowerCase().replaceAll(" ","-")+".txt";a.click();URL.revokeObjectURL(url)}
